<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Textbook Viewer</title>
<style>
  :root{
    --ink: #1f2a24;
    --paper: #f6f1e4;
    --paper-edge: #e6dcc2;
    --cover: #2f4a3e;
    --cover-2: #24392f;
    --accent: #b3762c;
    --muted: #6b7268;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0;
    background: var(--cover-2);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    overflow:hidden;
  }
  #app{
    height:100%;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-flex-direction:column; flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; align-items:center; gap:10px;
    padding: 10px 14px;
    background: var(--cover);
    color: #f2ede0;
    -webkit-flex-shrink:0; flex-shrink:0;
    z-index:20;
  }
  #topbar .title{
    font-size:14px; opacity:.85; -webkit-box-flex:1; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #topbar button, #topbar label.filebtn{
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.22);
    color:#f2ede0;
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 13px;
    cursor:pointer;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; align-items:center; gap:6px;
  }
  #topbar button:active, #topbar label.filebtn:active{ background: rgba(255,255,255,.24); }
  #fileInput{ display:none; }

  /* ---------- Stage ---------- */
  #stage{
    -webkit-box-flex:1; flex:1;
    position:relative;
    overflow:hidden;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; align-items:center;
    -webkit-box-pack:center; justify-content:center;
    background:
      -webkit-radial-gradient(50% 0%, ellipse, #3a5647 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, #3a5647 0%, transparent 60%),
      var(--cover-2);
  }
  #empty{
    color:#d8d2bd; text-align:center; max-width:280px; line-height:1.5;
  }
  #empty .big{ font-size:42px; margin-bottom:10px; }
  #empty .hint{ font-size:13px; opacity:.7; margin-top:6px; }

  #bookWrap{
    display:none;
    width:100%; height:100%;
    -webkit-box-align:center; align-items:center;
    -webkit-box-pack:center; justify-content:center;
    -webkit-perspective:2400px; perspective: 2400px;
    touch-action: none;
  }
  #bookWrap.active{ display:-webkit-box; display:-webkit-flex; display:flex; }

  #zoomLayer{
    -webkit-transform-origin: center center; transform-origin: center center;
    -webkit-transition: -webkit-transform .08s ease-out;
    transition: transform .08s ease-out;
    position:relative;
  }

  #book{
    position:relative;
    background: var(--paper-edge);
    -webkit-box-shadow: 0 20px 60px rgba(0,0,0,.45);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    border-radius: 3px;
  }

  .pageFace{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    background: var(--paper);
    background-size: cover;
    background-position: center;
    border-radius: 3px;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  #pageBehind{ z-index:1; }
  #pageFront{
    z-index:3;
    -webkit-transform-origin: left center; transform-origin: left center;
    -webkit-transition: -webkit-transform .55s cubic-bezier(.4,.1,.2,1);
    transition: transform .55s cubic-bezier(.4,.1,.2,1);
    -webkit-box-shadow: inset -10px 0 25px -15px rgba(0,0,0,.4);
    box-shadow: inset -10px 0 25px -15px rgba(0,0,0,.4);
  }
  #pageFront.flipping{ -webkit-transform: rotateY(-180deg); transform: rotateY(-180deg); }
  #pageFront .back{
    position:absolute; top:0; left:0; right:0; bottom:0;
    background: var(--paper);
    background-size:cover; background-position:center;
    -webkit-transform: rotateY(180deg); transform: rotateY(180deg);
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:3px;
    -webkit-box-shadow: inset 10px 0 25px -15px rgba(0,0,0,.35);
    box-shadow: inset 10px 0 25px -15px rgba(0,0,0,.35);
  }

  /* tap zones for turning pages */
  .tapzone{
    position:absolute; top:0; bottom:0; width:22%;
    z-index:5; cursor:pointer;
  }
  #tapPrev{ left:0; }
  #tapNext{ right:0; }

  /* ---------- Bottom bar ---------- */
  #bottombar{
    -webkit-flex-shrink:0; flex-shrink:0;
    display:none;
    -webkit-box-align:center; align-items:center;
    -webkit-box-pack:center; justify-content:center; gap:16px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--cover);
    color:#f2ede0;
  }
  #bottombar.active{ display:-webkit-box; display:-webkit-flex; display:flex; }
  #bottombar button{
    background: rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    color:#f2ede0;
    width:38px; height:38px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  #pageIndicator{
    font-size:13px; min-width:70px; text-align:center; opacity:.9;
  }
  #zoomIndicator{ font-size:12px; opacity:.7; width:44px; text-align:center; }

  #loading{
    position:absolute; top:0; right:0; bottom:0; left:0; display:none;
    -webkit-box-align:center; align-items:center;
    -webkit-box-pack:center; justify-content:center;
    color:#e9e4d3; font-size:13px; background: rgba(0,0,0,.25); z-index:30;
  }
  #loading.active{ display:-webkit-box; display:-webkit-flex; display:flex; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <label class="filebtn" for="fileInput">Open PDF</label>
    <input id="fileInput" type="file" accept="application/pdf">
    <div class="title" id="bookTitle">No textbook loaded</div>
  </div>

  <div id="stage">
    <div id="empty">
      <div class="big">&#128214;</div>
      Open a textbook PDF to start reading.
      <div class="hint">Tap the left/right edge of a page to turn it, like a real book. Pinch or use the buttons below to zoom.</div>
    </div>

    <div id="loading">Loading pages&hellip;</div>

    <div id="bookWrap">
      <div id="zoomLayer">
        <div id="book">
          <div class="pageFace" id="pageBehind"></div>
          <div class="pageFace" id="pageFront">
            <div class="back" id="pageFrontBack"></div>
          </div>
          <div class="tapzone" id="tapPrev"></div>
          <div class="tapzone" id="tapNext"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <button id="btnZoomOut">&minus;</button>
    <div id="zoomIndicator">100%</div>
    <button id="btnZoomIn">+</button>
    <div style="width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 4px;"></div>
    <button id="btnPrev">&lsaquo;</button>
    <div id="pageIndicator">&ndash; / &ndash;</div>
    <button id="btnNext">&rsaquo;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
<script>
// Using pdf.js 2.6.347: last release line with broad support back to older
// Chromium-based Android WebViews (roughly Android 5/Lollipop and up).
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js";

var fileInput = document.getElementById('fileInput');
var bookTitle = document.getElementById('bookTitle');
var emptyState = document.getElementById('empty');
var bookWrap = document.getElementById('bookWrap');
var bottombar = document.getElementById('bottombar');
var loading = document.getElementById('loading');

var book = document.getElementById('book');
var pageBehind = document.getElementById('pageBehind');
var pageFront = document.getElementById('pageFront');
var pageFrontBack = document.getElementById('pageFrontBack');
var zoomLayer = document.getElementById('zoomLayer');

var btnPrev = document.getElementById('btnPrev');
var btnNext = document.getElementById('btnNext');
var tapPrev = document.getElementById('tapPrev');
var tapNext = document.getElementById('tapNext');
var pageIndicator = document.getElementById('pageIndicator');
var zoomIndicator = document.getElementById('zoomIndicator');
var btnZoomIn = document.getElementById('btnZoomIn');
var btnZoomOut = document.getElementById('btnZoomOut');

var pdfDoc = null;
var totalPages = 0;
var currentPage = 1;
var isFlipping = false;
var zoom = 1;
var pageCache = {};

function renderPageToDataURL(num, cb){
  if(pageCache[num]){ cb(pageCache[num]); return; }
  pdfDoc.getPage(num).then(function(page){
    var viewport = page.getViewport(2);
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
      var url = canvas.toDataURL('image/jpeg', 0.85);
      pageCache[num] = url;
      cb(url);
    });
  });
}

function sizeBookToFirstPage(viewport){
  var stage = document.getElementById('stage');
  var maxW = stage.clientWidth * 0.86;
  var maxH = stage.clientHeight * 0.9;
  var w = viewport.width, h = viewport.height;
  var scale = Math.min(maxW / w, maxH / h);
  w *= scale; h *= scale;
  book.style.width = w + 'px';
  book.style.height = h + 'px';
}

function showPage(num){
  if(!pdfDoc) return;
  num = Math.max(1, Math.min(totalPages, num));
  renderPageToDataURL(num, function(url){
    pageBehind.style.backgroundImage = 'url(' + url + ')';
    pageFront.style.backgroundImage = 'url(' + url + ')';
    pageFrontBack.style.backgroundImage = 'url(' + url + ')';
    currentPage = num;
    pageIndicator.textContent = currentPage + ' / ' + totalPages;
    if(currentPage < totalPages) renderPageToDataURL(currentPage + 1, function(){});
    if(currentPage > 1) renderPageToDataURL(currentPage - 1, function(){});
  });
}

function turnPage(direction){
  if(isFlipping || !pdfDoc) return;
  var target = currentPage + direction;
  if(target < 1 || target > totalPages) return;
  isFlipping = true;

  renderPageToDataURL(target, function(targetUrl){
    if(direction === 1){
      pageBehind.style.backgroundImage = 'url(' + targetUrl + ')';
      pageFront.className = 'pageFace flipping';
      setTimeout(function(){
        pageFront.className = 'pageFace';
        pageFront.style.webkitTransition = 'none';
        pageFront.style.transition = 'none';
        pageFront.style.backgroundImage = 'url(' + targetUrl + ')';
        pageFrontBack.style.backgroundImage = 'url(' + targetUrl + ')';
        setTimeout(function(){
          pageFront.style.webkitTransition = '';
          pageFront.style.transition = '';
        }, 20);
        currentPage = target;
        pageIndicator.textContent = currentPage + ' / ' + totalPages;
        isFlipping = false;
        if(currentPage < totalPages) renderPageToDataURL(currentPage + 1, function(){});
      }, 560);
    } else {
      pageFrontBack.style.backgroundImage = pageFront.style.backgroundImage;
      pageFront.style.backgroundImage = 'url(' + targetUrl + ')';
      pageBehind.style.backgroundImage = 'url(' + targetUrl + ')';
      pageFront.style.webkitTransition = 'none';
      pageFront.style.transition = 'none';
      pageFront.style.webkitTransform = 'rotateY(-180deg)';
      pageFront.style.transform = 'rotateY(-180deg)';
      setTimeout(function(){
        pageFront.style.webkitTransition = '';
        pageFront.style.transition = '';
        pageFront.style.webkitTransform = 'rotateY(0deg)';
        pageFront.style.transform = 'rotateY(0deg)';
      }, 20);
      setTimeout(function(){
        currentPage = target;
        pageIndicator.textContent = currentPage + ' / ' + totalPages;
        isFlipping = false;
        if(currentPage > 1) renderPageToDataURL(currentPage - 1, function(){});
      }, 560);
    }
  });
}

btnNext.addEventListener('click', function(){ turnPage(1); });
btnPrev.addEventListener('click', function(){ turnPage(-1); });
tapNext.addEventListener('click', function(){ turnPage(1); });
tapPrev.addEventListener('click', function(){ turnPage(-1); });

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') turnPage(1);
  if(e.key === 'ArrowLeft') turnPage(-1);
});

// ---- Zoom controls ----
function applyZoom(){
  zoomLayer.style.webkitTransform = 'scale(' + zoom + ')';
  zoomLayer.style.transform = 'scale(' + zoom + ')';
  zoomIndicator.textContent = Math.round(zoom * 100) + '%';
}
btnZoomIn.addEventListener('click', function(){ zoom = Math.min(3, zoom + 0.25); applyZoom(); });
btnZoomOut.addEventListener('click', function(){ zoom = Math.max(1, zoom - 0.25); applyZoom(); });

var pinchStartDist = null, pinchStartZoom = 1;
bookWrap.addEventListener('touchstart', function(e){
  if(e.touches.length === 2){
    var a = e.touches[0], b = e.touches[1];
    pinchStartDist = Math.sqrt(Math.pow(a.clientX-b.clientX,2) + Math.pow(a.clientY-b.clientY,2));
    pinchStartZoom = zoom;
  }
}, false);
bookWrap.addEventListener('touchmove', function(e){
  if(e.touches.length === 2 && pinchStartDist){
    var a = e.touches[0], b = e.touches[1];
    var dist = Math.sqrt(Math.pow(a.clientX-b.clientX,2) + Math.pow(a.clientY-b.clientY,2));
    zoom = Math.max(1, Math.min(3, pinchStartZoom * (dist / pinchStartDist)));
    applyZoom();
  }
}, false);
bookWrap.addEventListener('touchend', function(e){
  if(e.touches.length < 2) pinchStartDist = null;
});

bookWrap.addEventListener('wheel', function(e){
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoom = Math.max(1, Math.min(3, zoom - e.deltaY * 0.002));
  applyZoom();
}, false);

// ---- File loading ----
fileInput.addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  loading.className = 'active';
  pageCache = {};
  zoom = 1; applyZoom();

  var reader = new FileReader();
  reader.onload = function(ev){
    pdfjsLib.getDocument({ data: ev.target.result }).promise.then(function(doc){
      pdfDoc = doc;
      totalPages = pdfDoc.numPages;
      bookTitle.textContent = file.name.replace(/\.pdf$/i, '');

      pdfDoc.getPage(1).then(function(firstPage){
        var viewport = firstPage.getViewport(2);
        sizeBookToFirstPage(viewport);
        showPage(1);
        emptyState.style.display = 'none';
        bookWrap.className = 'active';
        bottombar.className = 'active';
        loading.className = '';
      });
    });
  };
  reader.readAsArrayBuffer(file);
});

window.addEventListener('resize', function(){
  if(!pdfDoc) return;
  pdfDoc.getPage(1).then(function(p){
    sizeBookToFirstPage(p.getViewport(2));
  });
});
</script>
</body>
</html>
